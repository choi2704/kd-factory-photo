<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase 연결 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260811-1545"></script>
<style>
body{font-family:Arial,"Malgun Gothic",sans-serif;background:#eef4f8;padding:24px}
.box{max-width:700px;margin:auto;background:#fff;border-radius:16px;padding:22px}
button{padding:14px 20px;border:0;border-radius:10px;background:#143c5b;color:white;font-weight:900;font-size:18px}
pre{white-space:pre-wrap;background:#f4f7f9;padding:14px;border-radius:10px}
</style>
</head><body><div class="box">
<h1>Supabase 연결 테스트</h1>
<p>아래 버튼을 누르면 주문 테이블 연결만 확인합니다.</p>
<button id="test">연결 테스트</button>
<pre id="result">대기 중</pre>
</div>
<script src="supabase-common.js?v=20260811-1545"></script>
<script>
test.onclick = async () => {
  result.textContent = "확인 중...";
  if(!configured){ result.textContent="config.js 설정값을 확인하세요."; return; }
  try{
    const {data,error} = await db.from("production_orders").select("id").limit(1);
    if(error) throw error;
    result.textContent = "✅ 연결 성공\nURL: " + cfg.SUPABASE_URL;
  }catch(e){
    result.textContent = "❌ 연결 실패\n" + connectionHelp(e) + "\n\nURL: " + cfg.SUPABASE_URL;
  }
};
</script>
</body></html>
